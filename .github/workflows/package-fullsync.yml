          if-no-files-found: warn
          path: |
            frozen-upstream-effective.json
            frozen-upstream-postbuild.json
            UniXNU/out/sheng/*/*/logs/
            UniXNU/out/sheng/*/*/package.manifest.json
            UniXNU/out/sheng/*/*/*audit.json
            UniXNU/out/sheng/*/*/mesa-reviewed-source.json
            UniXNU/out/sheng/*/*/kernel/kernel.json
            UniXNU/out/sheng/*/*/kernel/kernel.failed.json
            UniXNU/out/sheng/*/*/kernel/kernel.map.json
            UniXNU/out/sheng/*/*/tree/build/native-legacy-display/build-report.json
            UniXNU/scripts/policies/ipados-27.0.1-24A446/prelink-regression.json
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-ios27.log
            UniXNU/out/sheng/*/*/tree/build/mesa-tu-ios27/meson-logs/meson-log.txt

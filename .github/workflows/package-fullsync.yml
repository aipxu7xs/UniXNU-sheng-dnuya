name: package

# FULL upstream sync round N+2: official device main + official framework main
# + sm8550 SoC pin bump (a9f45dc6 -> SoC main 2dc650ca: GeniUart/QupDma/VideoCc/AppsSmmu),
# + PR #229 cherry-pick, + the sheng ABL 0x218 DTB fix, + build-logs upload,
# + measured device-only USB closure and native driver (34 roots / 43 closure members).
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and
# is baked into the images, so the run's artifacts belong to one device alone:
# download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26-intel
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: verify Intel host and unchanged Xcode SDK inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 68800685763d755c368775b848dd703fb3f8a3ce # official device main (full upstream sync)
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a # official framework main (full upstream sync)
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38 # pinned: uefi-sheng main, unchanged since 2026-11-01
          path: uefi-sheng
          submodules: recursive
      - name: bump sm8550 SoC pin (Sm8550GeniUart.h requirement)
        # ROOT CAUSE (runs 43375570118 / 43388561958): device main's feeds.toml and
        # unixnu.lock pin SoC a9f45dc6, whose kits/Sm8550Platform lacks everything the
        # device build compiles - Sm8550GeniUart.h/.c (BluetoothProbe), Sm8550QupDma,
        # Sm8550VideoCc (video clock, H264) and Sm8550AppsSmmu. SoC main 2dc650ca has
        # all four; every file the build references is checked by preflight.
        run: |
          python3 - <<'PY'
          import pathlib
          OLD = 'a9f45dc60c035084b95463781538380f4c3606c9'
          NEW = '2dc650ca76ae38715cd0712e60a44b14fe251745'
          for rel in ('device/feeds.toml', 'device/unixnu.lock'):
              p = pathlib.Path(rel)
              t = p.read_text()
              if OLD in t:
                  p.write_text(t.replace(OLD, NEW))
                  print(rel + ': SoC pin ' + OLD[:8] + ' -> ' + NEW[:8])
              elif NEW in t:
                  print(rel + ': already on ' + NEW[:8])
              else:
                  raise SystemExit(rel + ': unexpected SoC pin; inspect feeds.toml')
          PY
      - name: apply pinned USB device-only sources and 34 roots
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          import pathlib,runpy,json
          helper = '"""Apply reviewed 24A446 USB device-only sources to supplied device/driver roots.\nNo network, workspace-relative inputs, or implicit repository lookup.\nRun BEFORE USB removal (which must be removed from the candidate workflow).\nUnrelated -Oz/storage/source edits outside the pinned USB block are preserved.\n"""\nimport argparse,ast,hashlib,json,pathlib,tomllib\nPROFILE_ROOTS = [\'com.apple.AppleFSCompression.AppleFSCompressionTypeZlib\', \'com.apple.driver.AppleARMPlatform\', \'com.apple.driver.AppleARMWatchdogTimer\', \'com.apple.driver.AppleAudioClockLibs\', \'com.apple.driver.AppleEffaceableStorage\', \'com.apple.driver.AppleIISController\', \'com.apple.driver.AppleM2ScalerCSCDriver\', \'com.apple.driver.AppleMobileFileIntegrity\', \'com.apple.driver.ApplePMGR\', \'com.apple.driver.IODARTFamily\', \'com.apple.filesystems.apfs\', \'com.apple.iokit.CoreAnalyticsFamily\', \'com.apple.iokit.IOAVFamily\', \'com.apple.iokit.IOAudio2Family\', \'com.apple.iokit.IOCECFamily\', \'com.apple.iokit.IOCryptoAcceleratorFamily\', \'com.apple.iokit.IOGPUFamily\', \'com.apple.iokit.IOHDCPFamily\', \'com.apple.iokit.IOMobileGraphicsFamily\', \'com.apple.iokit.IOReportFamily\', \'com.apple.iokit.IOSlowAdaptiveClockingFamily\', \'com.apple.iokit.IOStorageFamily\', \'com.apple.iokit.IOSurface\', \'com.apple.kec.Libm\', \'com.apple.kec.corecrypto\', \'com.apple.kext.AppleMatch\', \'com.apple.kext.CoreTrust\', \'com.apple.security.AppleImage4\', \'com.apple.security.sandbox\', \'com.apple.iokit.IOHIDFamily\', \'com.apple.iokit.IOHIDEventDriver\']\nOLD_ROOTS = [\'com.apple.AppleFSCompression.AppleFSCompressionTypeZlib\', \'com.apple.driver.AppleARMPlatform\', \'com.apple.driver.AppleARMWatchdogTimer\', \'com.apple.driver.AppleAudioClockLibs\', \'com.apple.driver.AppleEffaceableStorage\', \'com.apple.driver.AppleIISController\', \'com.apple.driver.AppleM2ScalerCSCDriver\', \'com.apple.driver.AppleMobileFileIntegrity\', \'com.apple.driver.ApplePMGR\', \'com.apple.driver.IODARTFamily\', \'com.apple.filesystems.apfs\', \'com.apple.iokit.CoreAnalyticsFamily\', \'com.apple.iokit.IOAVFamily\', \'com.apple.iokit.IOAudio2Family\', \'com.apple.iokit.IOCECFamily\', \'com.apple.iokit.IOCryptoAcceleratorFamily\', \'com.apple.iokit.IOGPUFamily\', \'com.apple.iokit.IOHDCPFamily\', \'com.apple.iokit.IOMobileGraphicsFamily\', \'com.apple.iokit.IOReportFamily\', \'com.apple.iokit.IOSlowAdaptiveClockingFamily\', \'com.apple.iokit.IOStorageFamily\', \'com.apple.iokit.IOSurface\', \'com.apple.kec.Libm\', \'com.apple.kec.corecrypto\', \'com.apple.kext.AppleMatch\', \'com.apple.kext.CoreTrust\', \'com.apple.security.AppleImage4\', \'com.apple.security.sandbox\', \'com.apple.iokit.IOHIDFamily\', \'com.apple.iokit.IOHIDEventDriver\', \'com.apple.iokit.IOUSBDeviceFamily\', \'com.apple.driver.AppleUSBXDCI\', \'com.apple.driver.AppleUSBDeviceMux\', \'com.apple.iokit.IOUSBHostFamily\', \'com.apple.driver.usb.AppleUSBXHCI\', \'com.apple.driver.usb.AppleUSBHub\', \'com.apple.driver.usb.AppleUSBHostCompositeDevice\', \'com.apple.driver.usb.IOUSBHostHIDDevice\', \'com.apple.iokit.IOUSBMassStorageDriver\', \'com.apple.iokit.IOSCSIArchitectureModelFamily\', \'com.apple.iokit.IOSCSIBlockCommandsDevice\', \'!com.apple.driver.AppleOnboardSerial\', \'!com.apple.driver.AppleSMC\']\nDEVICE_ROOTS = PROFILE_ROOTS + [\'com.apple.iokit.IOUSBDeviceFamily\', \'com.apple.driver.AppleUSBXDCI\', \'com.apple.driver.AppleUSBDeviceMux\']\nUSB_BEGIN = \'# USB device mode: the native SM8550 subclass\'\nUSB_END = \'# The VPU:\'\nUSB_BLOCK_SHA256 = \'934fa8786b78981247bdf0bdee66e803832ac7f8baa5711956899c57f46e8b0e\'\ndef check_usb_block(t):\n if t.count(USB_BEGIN)!=1 or t.count(USB_END)!=1:raise ValueError(\'USB block missing/ambiguous (removal already applied?)\')\n block=t[t.index(USB_BEGIN):t.index(USB_END)]\n if hashlib.sha256(block.encode()).hexdigest()!=USB_BLOCK_SHA256:raise ValueError(\'pinned USB builder block changed\')\ndef once(text,old,new):\n if text.count(old)!=1:raise ValueError(\'nonunique/missing anchor: \'+old[:100])\n return text.replace(old,new,1)\ndef span(text,start,end,new=\'\'):\n if text.count(start)!=1 or text.count(end)!=1:raise ValueError(\'nonunique span\')\n a=text.index(start);b=text.index(end,a);return text[:a]+new+text[b:]\ndef transform_driver(t):\n t=once(t,\'#include "OriginalUsbXhciABI.h"\\n\',\'\')\n t=span(t,"// Host mode: Apple\'s xHCI driver",\'namespace {\\nbool bringUp()\')\n t=once(t,\'enum Role {kRoleNone, kRoleDevice, kRoleHost};\',\'enum Role {kRoleNone, kRoleDevice};\')\n t=once(t,\'bool gForceHost;\\nRegion gGlobals, gXhciRegs;\\nQcomDwc3Nub *gDeviceNub, *gHostNub;\\nQcomDwc3Xhci *gHost;\',\'QcomDwc3Nub *gDeviceNub;\')\n t=once(t,\'    if (!gRoleLock) return;\',\'    if (!gRoleLock || (role != kRoleNone && role != kRoleDevice)) return;\')\n t=once(t,\'            else if (gUcsi.partner == kUcsiPartnerUfp || gUcsi.partner == kUcsiPartnerCableUfp) role = kRoleHost;\\n\',\'\')\n t=once(t,\'    wantRole(gForceHost ? kRoleHost : role);\',\'    wantRole(role);\')\n t=span(t,\'void forceHostThread(\', \'void leaveRole(\')\n t=span(t,\'    } else if (role == kRoleHost && gHostNub) {\',\'// qmp_combo_typec_switch_set\',\'    }\\n}\\n// Device-only: the XDCI reset owns the core mode; cable removal powers the device stack down.\\n\')\n t=span(t,\'void enterHost() {\',\'void enterRole(\')\n t=span(t,\'    setCoreRole(role);\',\'void roleThread(\',\'\'\'    QcomDwc3Nub::route(gDeviceNub);\n    IOService::getResourceService()->setProperty("AppleUSBCableType", "USBHost");\n    native_usb_stats[20] = (uint32_t)gController->cable(true);\n}\n\'\'\')\n t=span(t,\'        while (gRoleWanted == gRoleApplied) {\',\'        const int role = gRoleWanted;\', \'        while (gRoleWanted == gRoleApplied) IOLockSleep(gRoleLock, &gRoleWanted, THREAD_UNINT);\\n\')\n t=once(t,\'        if (role == kRoleHost) gDeviceStackAllowed = false;\\n\',\'\')\n t=once(t,\'extern "C" void qcom_dwc3_host_load(int result) {native_usb_stats[46] = (uint32_t)result << 16;}\\n\',\'\')\n t=span(t,\'        // usb-host=<seconds>:\', \'        gRoleLock = IOLockAlloc();\')\n t=once(t,\'        if (!gRoleLock || !mapRegion(gGlobals, kAppleWindow, 0x1000) || !mapRegion(gXhciRegs, kCore, 0x1000) ||\\n            kernel_thread_start(roleThread, nullptr, &thread) != KERN_SUCCESS)\', \'        if (!gRoleLock || kernel_thread_start(roleThread, nullptr, &thread) != KERN_SUCCESS)\')\n t=once(t,\'        if (forced && kernel_thread_start(forceHostThread, reinterpret_cast<void *>((uintptr_t)forced), &thread) == KERN_SUCCESS) thread_deallocate(thread);\\n\',\'\')\n for forbidden in [\'AppleUSBXHCI\',\'QcomDwc3Xhci\',\'kRoleHost\',\'gHost\',\'gXhci\',\'forceHostThread\',\'hostStats\',\'usb-host\',\'usb-back\',\'qcom_dwc3_host_load\']:\n  if forbidden in t:raise ValueError(\'host dependency remains: \'+forbidden)\n return t\n\ndef transform_probe(t):\n t=once(t,\'extern "C" void qcom_dwc3_host_load(int);\\n\',\'\')\n t=once(t,"        // The same for host mode: Apple\'s xHCI driver and the USB host family below it.\\n        qcom_dwc3_host_load((int)OSKextLoadKextWithIdentifier(\\"com.apple.driver.usb.AppleUSBXHCI\\"));\\n",\'\')\n return t\n\ndef transform_builder(t):\n check_usb_block(t)\n t=once(t,"MACOS = os.environ.get(\'UNIXNU_XNU_TARGET\') == \'macosx\'", "MACOS = os.environ.get(\'UNIXNU_XNU_TARGET\') == \'macosx\'\\nif BUILD != \'24A446\' or MACOS:\\n    raise SystemExit(\'This device-only USB candidate is qualified only for iPadOS 24A446 inputs.\')")\n t=span(t,\'# Host mode: the native subclass of the original AppleUSBXHCI\',"usb_flags = ")\n t=span(t,\'# Every inherited slot must be what the original has:\',"usb_text, usb_addresses = ","USB_DATA = {\'__ZN12AppleUSBXDCI10gMetaClassE\', \'__ZTV12AppleUSBXDCI\'}\\n")\n t=once(t,"print(f\'USB: {len(usb_bindings)} original bindings, {usb_vt} and {xhci_vt} match the original diversities\')","print(f\'USB device-only: {len(usb_bindings)} original bindings, {usb_vt} matches the original diversities\')")\n t=once(t,", ROOT / f\'scripts/usb-xhci-{BUILD}.json\'",\'\')\n t=once(t,"require(all(usb_entries), f\'{usb_vt}: at least the {len(usb_slots)} AppleUSBXDCI entries\')", "require(len(usb_entries) == len(usb_slots) and all(usb_entries), f\'{usb_vt}: all {len(usb_slots)} required AppleUSBXDCI entries\')")\n t=once(t,"usb_found = object_symbols(usb_raw)","usb_found = object_symbols(usb_raw)\\nrequire(not any(\'xhci\' in n.lower() for n, _, _ in usb_found), \'device-only object has no XHCI symbols\')")\n t=once(t,"for name, va in sorted(usb_bindings.items()):", "require(not any(\'xhci\' in n.lower() for n in usb_bindings), \'device-only bindings have no XHCI symbols\')\\nfor name, va in sorted(usb_bindings.items()):")\n ast.parse(t)\n return t\n\ndef transform_board(t):\n marker=\'["os_overrides"."ipados-27.0.1-24A446"."kernel"."prelink"]\'\n if t.count(marker)!=1:raise ValueError(\'27 prelink override missing or ambiguous\')\n data=tomllib.loads(t);actual=data[\'os_overrides\'][\'ipados-27.0.1-24A446\'][\'kernel\'][\'prelink\'][\'roots\']\n if actual!=OLD_ROOTS:raise ValueError(\'unexpected roots; refuse partial or previously transformed override\')\n pos=t.index(marker);end=t.find(chr(10)+\'[\',pos+len(marker));end=len(t) if end<0 else end\n section=t[pos:end];section=once(section,\'"roots" = \'+json.dumps(OLD_ROOTS),\'"roots" = \'+json.dumps(DEVICE_ROOTS))\n result=t[:pos]+section+t[end:];assert tomllib.loads(result)[\'os_overrides\'][\'ipados-27.0.1-24A446\'][\'kernel\'][\'prelink\'][\'roots\']==DEVICE_ROOTS\n return result\n\ndef apply(device_root,driver_root):\n device=pathlib.Path(device_root).resolve();driver=pathlib.Path(driver_root).resolve()\n items=[(driver/\'QcomDwc3.cpp\',transform_driver,\'dfa0cf5fd612e3a23f8006f7bf7d78b6ec19b06efbd207de24b71b1afaa78648\'),\n        (device/\'package/UsbProbe.cpp\',transform_probe,\'c8b7f630a33c67deee481d21033756dd1a533cb32dd1161f0939a8f16df223bd\'),\n        (device/\'scripts/build-gop-legacy-display-27.py\',transform_builder,None),\n        (device/\'board.toml\',transform_board,None)]\n pending=[]\n for path,transform,pin in items:\n  raw=path.read_bytes()\n  if pin and hashlib.sha256(raw).hexdigest()!=pin:raise ValueError(\'source hash drift: \'+str(path))\n  original=raw.decode(\'utf-8\').replace(chr(13)+chr(10),chr(10));updated=transform(original)\n  if path.suffix==\'.py\':ast.parse(updated)\n  pending.append((path,original,updated))\n # No file writes until every source, anchor, and syntax check passes.\n report=[]\n for path,original,updated in pending:\n  path.write_text(updated,encoding=\'utf-8\',newline=\'\\n\')\n  report.append({\'path\':str(path),\'before_sha256\':hashlib.sha256(original.encode()).hexdigest(),\'after_sha256\':hashlib.sha256(updated.encode()).hexdigest()})\n return report\nif __name__==\'__main__\':\n p=argparse.ArgumentParser(description=__doc__);p.add_argument(\'--device\',required=True);p.add_argument(\'--driver\',required=True);p.add_argument(\'--report\');a=p.parse_args()\n report=apply(a.device,a.driver)\n if a.report:pathlib.Path(a.report).write_text(json.dumps(report,indent=2))\n print(\'USB_DEVICE_ONLY_SOURCE\',json.dumps(report))\n'
          p=pathlib.Path('apply-usb-device.py');p.write_text(helper)
          report=runpy.run_path(str(p))['apply']('device','device/drivers/QcomDwc3')
          assert len(report)==4
          print('USB_DEVICE_ONLY_SOURCE',json.dumps(report))
          PY
      - name: sync reviewed ArmCpu Adreno740 and AdrenoMetal upstream fixes
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          import pathlib, runpy
          helper = '"""Select reviewed component commits in ephemeral framework checkout and its index."""\nfrom pathlib import Path\nimport subprocess,tomllib,re\nPINS={\n \'AdrenoMetal\':(\'73d582fd4d5772b1f5fa83581a25077a16f2b6cd\',\'89d7942e06dad93b5a5a52f817aa8c19fd899b37\'),\n \'ArmCpu\':(\'d90e457b8392623853ec85c860feef546c767621\',\'acba4ee2674cfb23434431feb124871ae9b3b581\'),\n \'Adreno740\':(\'54b41b8f59e90a167f6f75160739c5f825945fbc\',\'1c9029bc3216a39d9e514ba41dee12e95e8f3598\'),\n}\ndef git(root,*args):\n    return subprocess.check_output([\'git\',\'-C\',str(root),*args],text=True).strip()\ndef apply(root):\n    root=Path(root)\n    catalog=root/\'components.toml\';t=catalog.read_text(encoding=\'utf-8\')\n    specs={c[\'id\']:c for c in tomllib.loads(t)[\'component\']}\n    for name,(old,new) in PINS.items():\n        sub=root/\'drivers\'/name;actual=git(sub,\'rev-parse\',\'HEAD\')\n        assert actual in (old,new),(name,actual)\n        assert not git(sub,\'status\',\'--porcelain\'),name+\' has unreviewed local edits\'\n        assert git(sub,\'remote\',\'get-url\',\'origin\').removesuffix(\'.git\').endswith(\'/UniXNU/\'+name)\n        if actual!=new:\n            subprocess.run([\'git\',\'-C\',str(sub),\'fetch\',\'--depth\',\'1\',\'origin\',new],check=True)\n            subprocess.run([\'git\',\'-C\',str(sub),\'checkout\',\'--detach\',new],check=True)\n        assert git(sub,\'rev-parse\',\'HEAD\')==new\n        # update_submodules uses the index gitlink, so preserve this selected commit across fetch/tree.\n        subprocess.run([\'git\',\'-C\',str(root),\'update-index\',\'--cacheinfo\',f\'160000,{new},drivers/{name}\'],check=True)\n        assert git(root,\'ls-files\',\'--stage\',\'--\',f\'drivers/{name}\').split()[1]==new\n        pattern=r\'(?ms)(^\\[\\[component\\]\\]\\s*\\nid = "\'+name+r\'".*?^revision = ")[^"]+("$)\'\n        t,count=re.subn(pattern,lambda m:m[1]+new+m[2],t)\n        assert count==1,(name,\'catalog anchor\')\n        print(\'REVIEWED_UPSTREAM\',name,old,\'->\',new)\n    catalog.write_text(t,encoding=\'utf-8\')\n    updated={c[\'id\']:c for c in tomllib.loads(t)[\'component\']}\n    assert all(updated[n][\'revision\']==v[1] for n,v in PINS.items())\nif __name__==\'__main__\':apply(\'UniXNU\')\n'
          p = pathlib.Path('reviewed-upstream.py')
          p.write_text(helper, encoding='utf-8')
          runpy.run_path(str(p))['apply']('UniXNU')
          assert all((pathlib.Path('UniXNU/drivers') / n).is_dir() for n in ('ArmCpu','Adreno740'))
          PY
      - name: install hash-verified paired Metal builders and translator inputs
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          import ast,hashlib,pathlib,urllib.request
          REV='644ca91af38b8cf174a029a253b1aa816b0bd623'
          FILES=[{'path': 'scripts/build-adreno-metal-bridge.py', 'base_sha256': '12543b8f66ebe66c589d6ef5c68d8b737b51ae85c2d979749ccb56a3b0990358', 'selected_sha256': '073d044c4e97b608e9531ac14ececd0e5d93db8c566ea67fb455b037e8958975'}, {'path': 'scripts/build-adreno-metal-plugin.py', 'base_sha256': '8e4bbca4d36b317b0c508a3b3e7f2900435486dfc80db3930016997ec8d26995', 'selected_sha256': '332401a82955428ee88e0563e0c9a3c686641096e498fccb0eaddaedeb2682ac'}, {'path': 'scripts/data/gpu-metal-vulkan-inputs.json', 'base_sha256': '544e3bacd0fdcd478cd95163c9e0af7386d4d508efbc992976b59c757c6ef600', 'selected_sha256': '8894ea9c758ed3c2f23ee781a6167e0b5ca59569383ff0fa7d403bccc559ab27'}]
          pending=[]
          for item in FILES:
              relative=item['path'];target=pathlib.Path('UniXNU')/relative
              assert hashlib.sha256(target.read_bytes()).hexdigest() in (item['base_sha256'],item['selected_sha256']),relative
              # SourceTree copies framework, then SoC, then device: refuse a device override.
              assert not (pathlib.Path('device')/relative).exists(),relative+' device override'
              url='https://raw.githubusercontent.com/UniXNU/UniXNU/'+REV+'/'+relative
              with urllib.request.urlopen(url,timeout=120) as response: payload=response.read()
              assert hashlib.sha256(payload).hexdigest()==item['selected_sha256'],relative
              if relative.endswith('.py'):ast.parse(payload)
              pending.append((target,payload))
          for target,payload in pending:target.write_bytes(payload)
          print('METAL_PAIRED_SCRIPTS',REV,[p.as_posix() for p,_ in pending])
          PY
      - name: compile native board objects with -Oz (layout slack)
        # Measured failure: run 43601833150, fileset_layout.py:115 collision branch,
        # over_by=0x10000 (64 KiB), native __TEXT_EXEC=0xbbc000.
        # This matches run 43595027558: no-unwind gave no executable-budget gain.
        # Historical notes reported a 11968 KiB window, 11792 KiB baseline usage
        # and 160 KiB root-segment gap; these are not a consistent slack equation.
        # Use the actual aligned code_end and __DATA.va for acceptance.
        # Whole-kernel function counts do not measure board-only code growth.
        # The 1085 runtime.log -O2 commands were OpenSSL, not board recipes.
        # The official VPU builder uses -Os: "native text is short of room".
        # Keep the existing GOP helper experiment; optimize additional independent
        # builders below. Only a completed prelink can establish layout fit.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/scripts/build-gop-legacy-display-27.py')
          t = p.read_text()
          anchor = "    cmd += ['-Wall', '-Wextra', '-Werror', '-Wno-unused-parameter', '-Wno-unnecessary-virtual-specifier', '-Wno-c99-designator',\n            '-Wno-reorder-init-list', '-Wno-deprecated-enum-enum-conversion', '-I', str(ROOT / '.cache/xnu-work/osfmk'), *extra]"
          assert t.count(anchor) == 1, 'compile_cpp anchor not unique: %d' % t.count(anchor)
          new = anchor.replace("*extra]", "*extra, '-Oz', '-fno-asynchronous-unwind-tables', '-fno-unwind-tables']")
          t = t.replace(anchor, new, 1)
          assert new in t, 'compile_cpp replacement did not land'
          anchor_c = "    cmd += ['-Wall', '-Wextra', '-Werror', '-mgeneral-regs-only', '-I', str(ROOT / '.cache/xnu-work/osfmk'), '-I', str(ROOT / 'kits/sheng')]"
          assert t.count(anchor_c) == 1, 'compile_c anchor not unique: %d' % t.count(anchor_c)
          new_c = anchor_c.replace("'-I', str(ROOT / 'kits/sheng')]", "'-I', str(ROOT / 'kits/sheng'), '-Oz', '-fno-asynchronous-unwind-tables', '-fno-unwind-tables']")
          t = t.replace(anchor_c, new_c, 1)
          assert new_c in t, 'compile_c replacement did not land'
          p.write_text(t)
          print('build-gop-legacy-display-27.py: compile_cpp and compile_c now emit -Oz')
          PY
          python3 - <<'PY'
          import pathlib
          t = pathlib.Path('device/scripts/build-gop-legacy-display-27.py').read_text()

      - name: sheng ABL device tree (0x218 symbols)
        # Official main's sheng-abl-dtb.py adds splash_region via fdtput; the result carries no
        # /__symbols__ (dtc without -@), so ABL's dtbo_a overlay fixups all fail and it returns to
        # fastboot (the black screen we proved on the real device). Mirror niuzicheng666's
        # fetch-babylon-abldtb.py: copy the vendor_boot base tree that carries __symbols__, select
        # msm-id 0x218 (this handset ABL "Chiptype: 536"), overwrite build/sheng/sheng.dtb, then add
        # the step to board.toml preflight AFTER check-sheng.py.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PIT: raw.githubusercontent.com failed DNS resolution on the runner
          # (run 43395310378). Fetch through the API with the workflow token first;
          # fall back to raw with retries.
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          ref = 'b87a4cb89377914fdb0e11482a3e9221491db817'
          api = ('https://api.github.com/repos/niuzicheng666-source/UniXNU-sheng/'
                 'contents/scripts/fetch-babylon-abldtb.py?ref=' + ref)
          req = urllib.request.Request(api, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ.get('GITHUB_TOKEN', ''),
              'User-Agent': 'sheng-ci'})
          try:
              data = json.loads(urllib.request.urlopen(req, timeout=60).read())
              blob = base64.b64decode(data['content'])
              open('device/scripts/fetch-sheng-abldtb.py', 'wb').write(blob)
              print('fetched fetch-babylon-abldtb.py via api (%d bytes)' % len(blob))
          except Exception as error:
              print('api fetch failed (%s); falling back to raw' % error)
              raw = ('https://raw.githubusercontent.com/niuzicheng666-source/UniXNU-sheng/'
                     + ref + '/scripts/fetch-babylon-abldtb.py')
              subprocess.run(['curl', '-fsSL', '--retry', '5', '--retry-delay', '3',
                              '--retry-connrefused', '-o',
                              'device/scripts/fetch-sheng-abldtb.py', raw], check=True)
              print('fetched via raw')
          PY
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/scripts/fetch-sheng-abldtb.py')
          t = p.read_text()
          t = t.replace('EXPECTED_MSM_ID = (0x207, 0x20000)',
                        'EXPECTED_MSM_ID = (0x218, 0x20000)  # this handset: ABL "Chiptype: 536"')
          t = t.replace("OUTPUT = Path('build/babylon/babylon.dtb')",
                        "OUTPUT = Path('build/sheng/sheng.dtb')")
          p.write_text(t)
          b = pathlib.Path('device/board.toml')
          bt = b.read_text()
          old = '"scripts/import-sheng-uefi.py", "scripts/check-sheng.py"]'
          new = '"scripts/import-sheng-uefi.py", "scripts/check-sheng.py", "scripts/fetch-sheng-abldtb.py"]'
          if old not in bt:
              raise SystemExit('board.toml preflight anchor not found')
          b.write_text(bt.replace(old, new, 1))
          print('fetch-sheng-abldtb.py added AFTER check-sheng.py; board.toml preflight patched')
          PY
      - name: usb diagnostics (usb=2 register sampling + log-sys=1)
        # The QcomDwc3 driver is already in this build: build-gop-legacy-display-27.py
        # compiles drivers/QcomDwc3/QcomDwc3.cpp and package/UsbProbe.cpp
        # unconditionally, package/LegacyDisplayProbe.cpp calls the weak_import
        # sheng_usb_probe(), and kernel_args already carry usb=1.
        # What is missing is visibility: board.toml never sets log-sys, so none of the
        # native_usb_stats [usb] boot rows are printed, and usb=1 performs no register
        # sampling. usb=2 adds it (usb=3 would also take the controller off the bus and
        # back once).
        # Idempotent, and it only rewrites the kernel_args arrays that already carry usb.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/board.toml')
          t = p.read_text()
          pieces = t.split('"kernel_args" = [')
          if len(pieces) < 2:
              raise SystemExit('usb diagnostics: no kernel_args array in board.toml')
          out = [pieces[0]]
          touched = 0
          for chunk in pieces[1:]:
              body, brk, tail = chunk.partition(']')
              if not brk:
                  raise SystemExit('usb diagnostics: unterminated kernel_args array')
              args = [a.strip() for a in body.split(',')]
              if '"usb=1"' in args or '"usb=2"' in args:
                  args = ['"usb=2"' if a == '"usb=1"' else a for a in args]
                  if '"log-sys=1"' not in args:
                      args.append('"log-sys=1"')
                  touched += 1
                  out.append('"kernel_args" = [' + ', '.join(args) + ']' + tail)
              else:
                  out.append('"kernel_args" = [' + body + ']' + tail)
          if not touched:
              raise SystemExit('usb diagnostics: no kernel_args array carries usb=1')
          t2 = ''.join(out)
          if t2 != t:
              p.write_text(t2)
          print('usb diagnostics: %d kernel_args arrays -> usb=2 + log-sys=1' % touched)
          PY
          python3 - <<'PY'
          import pathlib
          t = pathlib.Path('device/board.toml').read_text()
          if '"usb=1"' in t:
              raise SystemExit('usb diagnostics: usb=1 still present')
          hits = 0
          for chunk in t.split('"kernel_args" = [')[1:]:
              body = chunk.split(']')[0]
              args = [a.strip() for a in body.split(',')]
              if '"usb=2"' in args:
                  hits += 1
                  if '"log-sys=1"' not in args:
                      raise SystemExit('usb diagnostics: log-sys=1 missing')
          if hits != 2:
              raise SystemExit('usb diagnostics: expected 2 arrays with usb=2, got %d' % hits)
          print('usb diagnostics verified: %d arrays carry usb=2 + log-sys=1' % hits)
          PY
      - name: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          source = '"""Install one upstream checksum-pinned macOS ipsw binary without Homebrew tap evaluation."""\nfrom pathlib import Path\nimport argparse,hashlib,os,platform,tarfile,urllib.request,time,struct\nVERSION=\'3.1.749\'\nASSETS={\'x86_64\':(\'macOS_x86_64_extras\',\'ce1c0e3b3d1382186061f14cdbbc1a07277473b3910d19e2beb87246a291ef51\',0x01000007),\'arm64\':(\'macOS_arm64_extras\',\'ea061d5f671c4703b571456886ac5d986a0f865a8c97a1914e0cbf41a270bdcc\',0x0100000c)}\ndef install(archive,dest,arch):\n suffix,want,cpu=ASSETS[arch];archive=Path(archive);dest=Path(dest)\n if hashlib.sha256(archive.read_bytes()).hexdigest()!=want:raise ValueError(\'ipsw archive digest mismatch\')\n with tarfile.open(archive,\'r:gz\') as tar:\n  members=[m for m in tar.getmembers() if m.isfile() and Path(m.name).name==\'ipsw\']\n  if len(members)!=1:raise ValueError(\'Expected one regular ipsw executable\')\n  member=members[0]\n  if member.size>256*1024*1024:raise ValueError(\'Executable unexpectedly large\')\n  data=tar.extractfile(member).read()\n if len(data)<32 or struct.unpack_from(\'<I\',data)[0]!=0xfeedfacf or struct.unpack_from(\'<I\',data,4)[0]!=cpu:raise ValueError(\'Wrong Mach-O host architecture\')\n dest.mkdir(parents=True,exist_ok=True);p=dest/\'ipsw\';tmp=dest/\'ipsw.partial\';tmp.write_bytes(data);os.chmod(tmp,0o755);tmp.replace(p)\n print(\'Verified ipsw\',VERSION,arch,hashlib.sha256(data).hexdigest());return p\nif __name__==\'__main__\':\n p=argparse.ArgumentParser();p.add_argument(\'--archive\',type=Path);p.add_argument(\'--dest\',type=Path,required=True);p.add_argument(\'--arch\',choices=ASSETS,default=platform.machine());a=p.parse_args()\n if a.arch not in ASSETS:raise SystemExit(\'Unsupported host\')\n archive=a.archive\n if archive is None:\n  a.dest.mkdir(parents=True,exist_ok=True);archive=a.dest/(\'ipsw-\'+VERSION+\'.tar.gz\');suffix=ASSETS[a.arch][0];url=f\'https://github.com/blacktop/ipsw/releases/download/v{VERSION}/ipsw_{VERSION}_{suffix}.tar.gz\'\n  for attempt in range(4):\n   try:\n    with urllib.request.urlopen(url,timeout=90) as r,archive.open(\'wb\') as f:\n     while chunk:=r.read(1024*1024):f.write(chunk)\n    break\n   except Exception:\n    if attempt==3:raise\n    time.sleep(2*(attempt+1))\n install(archive,a.dest,a.arch)\n'
          p=pathlib.Path('install-pinned-ipsw.py');p.write_text(source)
          assert p.is_file()
          PY
          python3 install-pinned-ipsw.py --arch x86_64 --dest "$RUNNER_TEMP/sheng-tools/bin"
          export PATH="$RUNNER_TEMP/sheng-tools/bin:$PATH"
          echo "$RUNNER_TEMP/sheng-tools/bin" >> "$GITHUB_PATH"
          ipsw version
          brew install --formula dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup openssl@3
          LLVM_PREFIX="$(brew --prefix llvm)"
          LLD_PREFIX="$(brew --prefix lld)"
          BISON_PREFIX="$(brew --prefix bison)"
          RUSTUP_PREFIX="$(brew --prefix rustup)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          # GITHUB_PATH only affects later steps; export the same precedence for this shell.
          export PATH="$HOME/.cargo/bin:$LLVM_PREFIX/bin:$LLD_PREFIX/bin:$BISON_PREFIX/bin:$RUSTUP_PREFIX/bin:$OPENSSL_PREFIX/bin:$PATH"
          {
            # The runner prepends each entry, so write these in reverse precedence.
            echo "$OPENSSL_PREFIX/bin"
            echo "$RUSTUP_PREFIX/bin"
            echo "$BISON_PREFIX/bin"
            echo "$LLD_PREFIX/bin"
            echo "$LLVM_PREFIX/bin"
            echo "$HOME/.cargo/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          rustup run 1.98.0 rustc --version
          rustup run 1.98.0 cargo --version
          # Preserve the original fail-fast tool gate and check executable permissions.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool mformat mcopy ipsw glslangValidator glslc spirv-val bison codesign hdiutil; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -x "$LLVM_PREFIX/bin/$t" ] || [ -x "$LLD_PREFIX/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ -f "$OPENSSL_PREFIX/include/openssl/evp.h" ] || { echo "missing OpenSSL 3 headers"; ok=0; }
          [ "$ok" = 1 ]
          # Execute native tools now: an incompatible host binary must fail before release.
          "$LLVM_PREFIX/bin/clang" --version
          "$LLD_PREFIX/bin/lld-link" --version
          "$BISON_PREFIX/bin/bison" --version

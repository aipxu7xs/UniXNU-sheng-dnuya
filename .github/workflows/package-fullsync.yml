          source = '"""Read-only post-package USB artifact gate. No third-party dependencies."""\nimport argparse,hashlib,json,pathlib,plistlib,struct\nDEVICE_KEXTS={\'com.apple.driver.AppleUSBDeviceMux\',\'com.apple.driver.AppleUSBXDCI\',\'com.apple.driver.usb.AppleUSBCommon\',\'com.apple.iokit.IOUSBDeviceFamily\'}\nREQUIRED=[\'_sheng_usb_probe\',\'_qcom_dwc3_bring_up\',\'_qcom_dwc3_publish\',\'_qcom_dwc3_vbus\',\'_qcom_ucsi_start\',\'_qcom_ucsi_receive\',\'_qcom_ucsi_tick\',\'_qcom_ucsi_polling\',\'_native_usb_stats\']\ndef image(raw,at=0):\n magic,cpu,sub,kind,count,size=struct.unpack_from(\'<6I\',raw,at);assert magic==0xfeedfacf and cpu==0x100000c\n segments=[];entries={};symbols={};absolute={};pos=at+32\n for _ in range(count):\n  cmd,length=struct.unpack_from(\'<II\',raw,pos);assert length>=8 and pos+length<=len(raw)\n  if cmd==0x19:\n   name,va,span,off,fs=struct.unpack_from(\'<16s4Q\',raw,pos+8);segments.append({\'name\':name.rstrip(bytes([0])).decode(),\'va\':va,\'size\':span,\'fileoff\':off,\'filesize\':fs})\n  elif cmd==0x80000035:\n   va,off,na=struct.unpack_from(\'<QQI\',raw,pos+8);end=raw.index(0,pos+na);entries[raw[pos+na:end].decode()]=(va,off)\n  elif cmd==2:\n   off,n,st,ss=struct.unpack_from(\'<4I\',raw,pos+8)\n   for i in range(n):\n    sx,ty,se,desc,va=struct.unpack_from(\'<IBBHQ\',raw,off+16*i)\n    if not sx or ty&0xe0:continue\n    name=raw[st+sx:raw.index(0,st+sx)].decode()\n    if ty&14==14:symbols[name]={\'va\':va,\'desc\':desc,\'section\':se}\n    elif ty&14==2:absolute[name]=va\n  pos+=length\n return {\'segments\':segments,\'entries\':entries,\'symbols\':symbols,\'absolute\':absolute}\ndef verify(base,expected_closure):\n base=pathlib.Path(base);m=json.loads((base/\'package.manifest.json\').read_text());raw=(base/\'kernel/kernel.macho\').read_bytes();assert hashlib.sha256(raw).hexdigest()==m[\'outputs\'][\'kernel.macho\'][\'sha256\']\n root=image(raw);native=image(raw,root[\'entries\'][\'com.apple.kernel\'][1]);seg=next(s for s in root[\'segments\'] if s[\'name\']==\'__PRELINK_INFO\');meta=plistlib.loads(raw[seg[\'fileoff\']:seg[\'fileoff\']+seg[\'filesize\']].split(bytes([0]),1)[0]);closure={e[\'CFBundleIdentifier\'] for e in meta[\'_PrelinkInfoDictionary\']}\n assert closure==set(expected_closure),(sorted(closure-set(expected_closure)),sorted(set(expected_closure)-closure));assert len(closure)==43\n assert DEVICE_KEXTS<=set(root[\'entries\']);assert \'com.apple.iokit.IOUSBHostFamily\' not in closure and not any(\'XHCI\' in n for n in root[\'entries\'])\n syms=native[\'symbols\'];assert all(n in syms for n in REQUIRED),[n for n in REQUIRED if n not in syms]\n assert not any(syms[n][\'desc\']&0x80 for n in REQUIRED),\'USB hooks resolved to weak definitions\'\n assert not any(\'xhci\' in n.lower() for n in syms),\'native XHCI symbol remains\'\n assert any(\'QcomDwc3Xdci\' in n and \'gMetaClass\' in n for n in syms),\'device metaclass absent\'\n assert \'__ZTV12QcomDwc3Xdci\' in syms,\'device vtable absent\'\n probe=syms[\'_sheng_usb_probe\'][\'va\'];s=next(s for s in native[\'segments\'] if s[\'va\']<=probe<s[\'va\']+s[\'filesize\']);assert s[\'name\']==\'__TEXT_EXEC\'\n at=s[\'fileoff\']+probe-s[\'va\'];words=struct.unpack_from(\'<8I\',raw,at);assert words[0]!=0xd65f03c0 and words[1]!=0xd65f03c0,\'probe is RET or MOV/RET stub\'\n nextva=min((x[\'va\'] for x in syms.values() if x[\'va\']>probe),default=probe);assert nextva-probe>=16,\'probe too short for real launch path\'\n usbabs={n:v for n,v in native[\'absolute\'].items() if \'AppleUSBXDCI\' in n and n.endswith(\'.original\')};assert usbabs,\'missing original XDCI branch bindings\'\n for n,va in usbabs.items():\n  owners=[name for name,(_,off) in root[\'entries\'].items() if name!=\'com.apple.kernel\' for s in image(raw,off)[\'segments\'] if s[\'name\']==\'__TEXT_EXEC\' and s[\'va\']<=va<s[\'va\']+s[\'filesize\']]\n  assert len(owners)==1 and owners[0] in DEVICE_KEXTS,(n,hex(va),owners)\n  stub=n[:-len(\'.original\')];assert stub in syms,(\'mis
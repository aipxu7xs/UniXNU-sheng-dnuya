name: package

# FULL upstream sync round N+2: official device main + official framework main
# + sm8550 SoC pin bump (a9f45dc6 -> SoC main 2dc650ca: GeniUart/QupDma/VideoCc/AppsSmmu),
# + PR #229 cherry-pick, + the sheng ABL 0x218 DTB fix, + build-logs upload,
# + measured device-only USB closure and native driver (34 roots / 43 closure members).
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and
# is baked into the images, so the run's artifacts belong to one device alone:
# download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26-intel
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: verify Intel host and unchanged Xcode SDK inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
      - name: check out reviewed build step scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-self
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 68800685763d755c368775b848dd703fb3f8a3ce # official device main (full upstream sync)
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 71b8a5a3d78edfe6404a706c1ebccd9915fb3c5e # frozen complete framework audit
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: b303410c8e401fc9419ae65a024356ed09a438ef # frozen UEFI audit; reviewed board backports follow separately
          path: uefi-sheng
          submodules: recursive
      - name: bump sm8550 SoC pin (Sm8550GeniUart.h requirement)
        # ROOT CAUSE (runs 43375570118 / 43388561958): device main's feeds.toml and
        # unixnu.lock pin SoC a9f45dc6, whose kits/Sm8550Platform lacks everything the
        # device build compiles - Sm8550GeniUart.h/.c (BluetoothProbe), Sm8550QupDma,
        # Sm8550VideoCc (video clock, H264) and Sm8550AppsSmmu. SoC main 2dc650ca has
        # all four; every file the build references is checked by preflight.
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/004-bump-sm8550-soc-pin-sm8550geniuart-h-requirement.sh"
      - name: apply pinned USB device-only sources and 34 roots
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/005-apply-pinned-usb-device-only-sources-and-34-roots.sh"
      - name: verify frozen framework component gitlinks before local repairs
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/006-verify-frozen-framework-component-gitlinks-before-local-repa.sh"
      - name: verify frozen Metal builders translator and overlay pairing
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/007-verify-frozen-metal-builders-translator-and-overlay-pairing.sh"
      - name: compile native board objects with -Oz (layout slack)
        # Measured failure: run 43601833150, fileset_layout.py:115 collision branch,
        # over_by=0x10000 (64 KiB), native __TEXT_EXEC=0xbbc000.
        # This matches run 43595027558: no-unwind gave no executable-budget gain.
        # Historical notes reported a 11968 KiB window, 11792 KiB baseline usage
        # and 160 KiB root-segment gap; these are not a consistent slack equation.
        # Use the actual aligned code_end and __DATA.va for acceptance.
        # Whole-kernel function counts do not measure board-only code growth.
        # The 1085 runtime.log -O2 commands were OpenSSL, not board recipes.
        # The official VPU builder uses -Os: "native text is short of room".
        # Keep the existing GOP helper experiment; optimize additional independent
        # builders below. Only a completed prelink can establish layout fit.
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/008-compile-native-board-objects-with-oz-layout-slack.sh"
      - name: optimize independent board builders for 24A446
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/009-optimize-independent-board-builders-for-24a446.sh"
      - name: repair GPU selftest IOVA and kernel client contract
        if: inputs.os == '27'
        working-directory: device
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/010-repair-gpu-selftest-iova-and-kernel-client-contract.sh"
      - name: use plain GICR priority stores for the 24A446 fault experiment
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/011-use-plain-gicr-priority-stores-for-the-24a446-fault-experime.sh"
      - name: enable GPU self-tests in the iPadOS kernel
        if: inputs.os == '27'
        working-directory: device
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/012-enable-gpu-self-tests-in-the-ipados-kernel.sh"
      - name: report the SError syndrome at the unhandled branch (diagnostic)
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/013-report-the-serror-syndrome-at-the-unhandled-branch-diagnosti.sh"
      - name: enforce USB closure imports and print prelink evidence
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/014-enforce-usb-closure-imports-and-print-prelink-evidence.sh"
      - name: layout collide diagnostics (print numbers before the exception)
        # Runs 43571646791 and 43586156184 both died at fileset_layout.py:115 with
        # no numbers on the page. Patch the framework's Layout to print
        # __DATA.va, code_end, over_by and native __TEXT_EXEC size at the exact
        # collision branch, so the next failure (or success) carries the real
        # budget numbers. Pure diagnostics: the success path is untouched.
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/015-layout-collide-diagnostics-print-numbers-before-the-exceptio.sh"
      - name: allocate board data buffers at runtime for 24A446
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/016-allocate-board-data-buffers-at-runtime-for-24a446.sh"
      - name: stage reviewed source payload chunk 1
        if: inputs.os == '27'
        run: bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/ci-self/ci/steps/017-stage-reviewed-source-payload-chunk-1.sh"
      - name: stage reviewed source payload chunk 2
        if: inputs.os == '27'

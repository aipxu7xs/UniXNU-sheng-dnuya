          python3 "$GITHUB_WORKSPACE/ci-self/ci/collect-rust-provenance.py" --tree "$BASE/tree" --target ios27 --output "$BASE/logs/rust-provenance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

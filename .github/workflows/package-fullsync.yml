name: package

# FULL upstream sync round N+2: official device main + official framework main
# + sm8550 SoC pin bump (a9f45dc6 -> SoC main 2dc650ca: GeniUart/QupDma/VideoCc/AppsSmmu),
# + PR #229 cherry-pick, + the sheng ABL 0x218 DTB fix, + build-logs upload,
# + restore the 27 profile's default prelink roots (run 43528673031 layout fix).
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and
# is baked into the images, so the run's artifacts belong to one device alone:
# download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 68800685763d755c368775b848dd703fb3f8a3ce # official device main (full upstream sync)
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a # official framework main (full upstream sync)
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38 # pinned: uefi-sheng main, unchanged since 2026-11-01
          path: uefi-sheng
          submodules: recursive
      - name: bump sm8550 SoC pin (Sm8550GeniUart.h requirement)
        # ROOT CAUSE (runs 43375570118 / 43388561958): device main's feeds.toml and
        # unixnu.lock pin SoC a9f45dc6, whose kits/Sm8550Platform lacks everything the
        # device build compiles - Sm8550GeniUart.h/.c (BluetoothProbe), Sm8550QupDma,
        # Sm8550VideoCc (video clock, H264) and Sm8550AppsSmmu. SoC main 2dc650ca has
        # all four; every file the build references is checked by preflight.
        run: |
          python3 - <<'PY'
          import pathlib
          OLD = 'a9f45dc60c035084b95463781538380f4c3606c9'
          NEW = '2dc650ca76ae38715cd0712e60a44b14fe251745'
          for rel in ('device/feeds.toml', 'device/unixnu.lock'):
              p = pathlib.Path(rel)
              t = p.read_text()
              if OLD in t:
                  p.write_text(t.replace(OLD, NEW))
                  print(rel + ': SoC pin ' + OLD[:8] + ' -> ' + NEW[:8])
              elif NEW in t:
                  print(rel + ': already on ' + NEW[:8])
              else:
                  raise SystemExit(rel + ': unexpected SoC pin; inspect feeds.toml')
          PY
      - name: compile native board objects with -Oz (layout slack)
        # Measured failure: run 43601833150, fileset_layout.py:115 collision branch,
        # over_by=0x10000 (64 KiB), native __TEXT_EXEC=0xbbc000.
        # This matches run 43595027558: no-unwind gave no executable-budget gain.
        # Historical notes reported a 11968 KiB window, 11792 KiB baseline usage
        # and 160 KiB root-segment gap; these are not a consistent slack equation.
        # Use the actual aligned code_end and __DATA.va for acceptance.
        # Whole-kernel function counts do not measure board-only code growth.
        # The 1085 runtime.log -O2 commands were OpenSSL, not board recipes.
        # The official VPU builder uses -Os: "native text is short of room".
        # Keep the existing GOP helper experiment; optimize additional independent
        # builders below. Only a completed prelink can establish layout fit.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/scripts/build-gop-legacy-display-27.py')
          t = p.read_text()
          anchor = "    cmd += ['-Wall', '-Wextra', '-Werror', '-Wno-unused-parameter', '-Wno-unnecessary-virtual-specifier', '-Wno-c99-designator',\n            '-Wno-reorder-init-list', '-Wno-deprecated-enum-enum-conversion', '-I', str(ROOT / '.cache/xnu-work/osfmk'), *extra]"
          assert t.count(anchor) == 1, 'compile_cpp anchor not unique: %d' % t.count(anchor)
          new = anchor.replace("*extra]", "*extra, '-Oz', '-fno-asynchronous-unwind-tables', '-fno-unwind-tables']")
          t = t.replace(anchor, new, 1)
          assert new in t, 'compile_cpp replacement did not land'
          anchor_c = "    cmd += ['-Wall', '-Wextra', '-Werror', '-mgeneral-regs-only', '-I', str(ROOT / '.cache/xnu-work/osfmk'), '-I', str(ROOT / 'kits/sheng')]"
          assert t.count(anchor_c) == 1, 'compile_c anchor not unique: %d' % t.count(anchor_c)
          new_c = anchor_c.replace("'-I', str(ROOT / 'kits/sheng')]", "'-I', str(ROOT / 'kits/sheng'), '-Oz', '-fno-asynchronous-unwind-tables', '-fno-unwind-tables']")
          t = t.replace(anchor_c, new_c, 1)
          assert new_c in t, 'compile_c replacement did not land'
          p.write_text(t)
          print('build-gop-legacy-display-27.py: compile_cpp and compile_c now emit -Oz')
          PY
          python3 - <<'PY'
          import pathlib
          t = pathlib.Path('device/scripts/build-gop-legacy-display-27.py').read_text()
          import re
          n = len(re.findall(r"-Os\b", t)) + len(re.findall(r"-Oz\b", t))
          assert n >= 3, 'expected at least 3 -Os/-Oz tokens (2 patched -Oz + 1 official VPU -Os), got %d' % n
          assert t.count('-fno-asynchronous-unwind-tables') >= 2, 'no-unwind flags not landed: %d' % t.count('-fno-asynchronous-unwind-tables')
          assert "*extra, '-Oz'" in t and "kits/sheng'), '-Oz'" in t, 'patched -Oz anchors missing'
          import ast
          ast.parse(t)
          print('assertion ok: -Os/-Oz tokens =', n, '; anchors applied; script parses')
          PY
      - name: omit USB device mode from the 27 kernel (kexts are not prelinked)
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          """Remove the USB device driver from the 24A446 (27) kernel build.

          The 27 profile does not prelink the AppleUSBXDCI/AppleUSBXHCI kexts: the board's
          official roots override is dropped because those stacks' __DATA does not fit,
          and the retained-kext code would also push native code past collection __DATA.
          XnuPrelink therefore refuses the dwc3 subclass' `.original` absolute targets
          ("Original target is not retained executable code").  The driver cannot bind a
          kext that is not in the collection, so the 27 kernel omits the whole device-mode
          block: QcomDwc3, UsbProbe, the generated ABI headers and the stub adapters.
          `sheng_usb_probe` is a weak_import hook, so nothing else needs it.
          """
          import argparse
          import ast
          from pathlib import Path
          NL = chr(10)

          def apply(source: str) -> str:

              def once(old, new):
                  nonlocal source
                  found = source.count(old)
                  if found != 1:
                      raise ValueError('USB removal anchor expected once, found %d: %r' % (found, old[:90]))
                  source = source.replace(old, new, 1)
              start = '# USB device mode: the native SM8550 subclass of the original AppleUSBXDCI of this fileset.' + NL
              end = "input_objects += [usb_late, USB_OUT / 'usb-bindings.o', USB_OUT / 'usb-addresses.o', USB_OUT / 'UsbProbe.o']" + NL
              if source.count(start) != 1 or source.count(end) != 1:
                  raise ValueError('USB removal block anchors are not unique')
              first = source.index(start)
              last = source.index(end, first) + len(end)
              span = source[first:last]
              for required in ('OriginalUsbXdciABI', 'OriginalUsbXhciABI', 'usb_bindings', 'usb-addresses.S'):
                  if required not in span:
                      raise ValueError('USB removal span does not cover ' + required)
              note = '# USB device mode is not built for the 27 kernel: the AppleUSBXDCI and AppleUSBXHCI' + NL + '# kexts are not prelinked (their __DATA does not fit), so the native dwc3 subclass' + NL + '# cannot bind them. The usb= kernel argument stays with no driver to consume it.' + NL
              source = source[:first] + note + source[last:]
              once("print(f'USB: {len(usb_bindings)} original bindings, {usb_vt} and {xhci_vt} match the original diversities')" + NL, '')
              once("sources += [KITS / name for name in ('SmmuBypass.h', 'AppsSmmuLock.h', 'UsbProbe.cpp')]", "sources += [KITS / name for name in ('SmmuBypass.h', 'AppsSmmuLock.h')]")
              once("sources += [USB / 'QcomDwc3.cpp', USB / 'QcomEusb2Phy.h', USB / 'QcomQmpUsb3.h', USB / 'QcomUcsi.h', ROOT / f'scripts/usb-xdci-{BUILD}.json', ROOT / f'scripts/usb-xhci-{BUILD}.json']" + NL, '')
              for token in ('usb_bindings', 'usb_late', 'QcomDwc3', 'USB_OUT', 'USB / '):
                  if token in source:
                      raise ValueError('USB removal left a reference: ' + token)
              ast.parse(source)
              return source
          p = Path('device/scripts/build-gop-legacy-display-27.py')
          original = p.read_text(encoding='utf-8')
          patched = apply(original)
          assert patched != original, "USB removal produced no change"
          assert 'usb_bindings' not in patched and 'QcomDwc3' not in patched
          p.write_text(patched, encoding='utf-8')
          print("USB DEVICE MODE OMITTED (kexts not prelinked)")
          PY
      - name: optimize independent board builders for 24A446
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          patches = [
              ('device/scripts/build-qcom-iris.py', "    (out / (source.stem + '.command.json')).write_text", '    ', 'cmd'),
              ('UniXNU/scripts/build-arm-driver.py', "(out / 'compile-command.json').write_text", '', 'command'),
              ('UniXNU/scripts/build-sheng-source-drivers.py', '    return command', '    ', 'command'),
          ]
          for rel, marker, indent, argv in patches:
              p = pathlib.Path(rel)
              t = p.read_text()
              assert t.count(marker) == 1, (rel, 'optimization anchor must be unique')
              lines = [
                  indent + "if __import__('os').environ.get('UNIXNU_IPSW_BUILD') == '24A446':",
                  indent + '    ' + argv + ".append('-Oz')",
                  indent + '    ' + "print('BOARD_OPT', str(source), [v for v in " + argv + " if v.startswith('-O')], file=__import__('sys').stderr, flush=True)",
              ]
              replacement = chr(10).join(lines) + chr(10) + marker
              t = t.replace(marker, replacement, 1)
              assert replacement in t, (rel, 'optimization replacement missing')
              ast.parse(t)
              p.write_text(t)
              print('Patched independent builder:', rel)
          PY
      - name: report the SError syndrome at the unhandled branch (diagnostic)
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          import pathlib
          helper = '#!/usr/bin/env python3\n"""sheng diagnostic: make the XNU SError unhandled branch print its syndrome.\n\narm64_implementation_specific_error() drops esr/far and panics with a fixed text,\nso the early SError seen on 24A446 cannot be attributed. This only widens that\npanic message; no control flow, mapping or driver behaviour changes.\n"""\nimport pathlib\n\nSOURCE = pathlib.Path(\'.cache/xnu-work/osfmk/arm64/sleh.c\')\nMARKER = \'SHENG SERROR DIAG\'\nOLD = \'\\tpanic_plain("Unhandled implementation specific error\\\\n");\'\nNEW = (\n    \'\\t/* SHENG SERROR DIAG: report the syndrome the unhandled branch hides. */\\n\'\n    \'\\tpanic_plain("SError unhandled: esr=0x%016llx ec=%u iss=0x%08x\\\\n"\\n\'\n    \'\\t    "\\\\tfar=0x%016llx pc=0x%016llx lr=0x%016llx\\\\n",\\n\'\n    \'\\t    (unsigned long long)esr, (unsigned)ESR_EC(esr), (unsigned)ESR_ISS(esr),\\n\'\n    \'\\t    (unsigned long long)far, (unsigned long long)state->pc,\\n\'\n    \'\\t    (unsigned long long)state->lr);\\n\'\n)\n\n\ndef main():\n    if not SOURCE.is_file():\n        raise SystemExit(\'sleh.c not prepared: %s\' % SOURCE)\n    text = SOURCE.read_text(encoding=\'utf-8\')\n    if MARKER in text:\n        print(\'sleh.c: SError syndrome diagnostic already installed\')\n        return\n    if text.count(OLD) != 1:\n        raise SystemExit(\'SError panic branch not unique: %d\' % text.count(OLD))\n    text = text.replace(OLD, NEW, 1)\n    assert MARKER in text and OLD not in text\n    SOURCE.write_text(text, encoding=\'utf-8\')\n    print(\'sleh.c: SError syndrome diagnostic installed\')\n\n\nif __name__ == \'__main__\':\n    main()\n'
          pathlib.Path('UniXNU/scripts/sheng-serror-diag.py').write_text(helper, encoding='utf-8')
          p = pathlib.Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          t = p.read_text(encoding='utf-8')
          anchor = 'python3 scripts/prepare-xnu-source.py' + chr(10)
          assert t.count(anchor) == 1, 'prepare-xnu-source anchor must be unique'
          call = 'python3 ' + chr(34) + '$ROOT/scripts/sheng-serror-diag.py' + chr(34) + chr(10)
          assert call not in t, 'diagnostic call already inserted'
          t = t.replace(anchor, call + anchor, 1)
          assert call in t
          p.write_text(t, encoding='utf-8')
          print('build-xnu-4k-baseline.sh: SError diagnostic hook inserted')
          PY
      - name: layout collide diagnostics (print numbers before the exception)
        # Runs 43571646791 and 43586156184 both died at fileset_layout.py:115 with
        # no numbers on the page. Patch the framework's Layout to print
        # __DATA.va, code_end, over_by and native __TEXT_EXEC size at the exact
        # collision branch, so the next failure (or success) carries the real
        # budget numbers. Pure diagnostics: the success path is untouched.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/kits/XnuPrelink/fileset_layout.py')
          t = p.read_text()
          old = "        if code_end > self.roots['__DATA']['va']:\n            raise ValueError('Native code would collide with collection data')"
          assert t.count(old) == 1, 'collide branch not unique: %d' % t.count(old)
          new = ("        if code_end > self.roots['__DATA']['va']:\n"
                 "            print(f'LAYOUT COLLIDE: __DATA.va={self.roots[\"__DATA\"][\"va\"]:#x} code_end={code_end:#x} '\n"
                 "                  f'over_by={code_end - self.roots[\"__DATA\"][\"va\"]:#x} native_text_exec={next(s for s in self.native.segments if s[\"name\"] == \"__TEXT_EXEC\")[\"size\"]:#x}')\n"
                 "            raise ValueError('Native code would collide with collection data')")
          t = t.replace(old, new, 1)
          assert 'LAYOUT COLLIDE' in t and t.count(old) == 0
          import ast
          ast.parse(t)
          p.write_text(t)
          print('layout diagnostics patched')
          PY
      - name: allocate board data buffers at runtime for 24A446
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          """Strict IrisMedia.cpp permanent-storage patch (68800685 layout)."""
          import argparse
          import hashlib
          from pathlib import Path

          def apply(source: str) -> str:
              if hashlib.sha256(source.encode('utf-8')).hexdigest() != '5e5d039163862ea0c31402bad42d47d2c1202da6250158b5ac11ab9b894fcd6a':
                  raise ValueError('IrisMedia.cpp differs from pinned 68800685 source')

              def replace(old, new, count=1):
                  nonlocal source
                  actual = source.count(old)
                  if actual != count:
                      raise ValueError(f'Iris storage anchor expected {count}, found {actual}: {old[:100]!r}')
                  source = source.replace(old, new)
              replace('Media gTable[MaxSessions];\nuint32_t gNextId = 1;\nNote gRing[RingSize];', '// Allocated once, retained for the lifetime of the driver/event thread.\n// Every access and publication is protected by the device lock.\nstruct MediaStorage {\n    Media table[MaxSessions];\n    Note ring[RingSize];\n};\nMediaStorage *gStorage;\nuint32_t gNextId = 1;')
              replace('IOLock *lock() { return QcomIrisDeviceLock(); }', 'IOLock *lock() { return QcomIrisDeviceLock(); }\n// Called without the device lock: allocation may block. Losers free only\n// their unpublished candidate; the published storage is never reclaimed.\nbool ensureStorage() {\n    IOLock *l = lock();\n    IOLockLock(l);\n    const bool ready = gStorage != nullptr;\n    IOLockUnlock(l);\n    if (ready) return true;\n    MediaStorage *candidate = static_cast<MediaStorage *>(IOMalloc(sizeof(MediaStorage)));\n    if (candidate) memset(candidate, 0, sizeof *candidate);\n    IOLockLock(l);\n    if (!gStorage && candidate) { gStorage = candidate; candidate = nullptr; }\n    const bool published = gStorage != nullptr;\n    IOLockUnlock(l);\n    if (candidate) IOFree(candidate, sizeof *candidate);\n    return published;\n}')
              replace('bool gThreadStarted;', 'bool gThreadStarted, gThreadStarting;')
              replace('Media *find(uint32_t id) {', 'Media *find(uint32_t id) {\n    if (!gStorage) return nullptr;')
              replace('for (Media &m : gTable)', 'for (Media &m : gStorage->table)')
              replace('for (Media &candidate : gTable)', 'for (Media &candidate : gStorage->table)')
              replace('void note(const Note &n) {', 'void note(const Note &n) {\n    if (!gStorage) return;')
              replace('gRing[gHead++ % RingSize]', 'gStorage->ring[gHead++ % RingSize]')
              replace('gRing[gTail++ % RingSize]', 'gStorage->ring[gTail++ % RingSize]')
              replace('&gRing', '&gStorage', 2)
              replace('while (gHead == gTail)', 'while (!gStorage || gHead == gTail)')
              replace("/* ---- the firmware's callbacks", "// Reserve startup under the lock, but create the thread outside it. A failed\n// creation releases the reservation so either set_sink or open can retry.\nbool startEventThread() {\n    IOLock *l = lock();\n    IOLockLock(l);\n    const bool start = gStorage && gSink && !gThreadStarted && !gThreadStarting;\n    if (start) gThreadStarting = true;\n    IOLockUnlock(l);\n    if (start) {\n        thread_t thread;\n        if (kernel_thread_start(eventThread, nullptr, &thread) == KERN_SUCCESS) thread_deallocate(thread);\n        else {\n            IOLockLock(l);\n            gThreadStarting = false;\n            IOLockUnlock(l);\n            return false;\n        }\n        IOLockLock(l);\n        gThreadStarted = true;\n        gThreadStarting = false;\n        IOLockUnlock(l);\n    }\n    return true;\n}\n\n/* ---- the firmware's callbacks")
              replace('    const bool start = !gThreadStarted;\n    gThreadStarted = true;\n    IOLockUnlock(lock());\n    if (start) {\n        thread_t thread;\n        if (kernel_thread_start(eventThread, nullptr, &thread) == KERN_SUCCESS) thread_deallocate(thread);\n    }\n}', '    IOLockUnlock(lock());\n    // Keep the sink even on allocation failure; open can retry initialization.\n    if (ensureStorage()) startEventThread();\n}')
              replace('    if (!iris_media_is_up(device) || !session) return Enodev;', '    if (!iris_media_is_up(device) || !session) return Enodev;\n    if (!ensureStorage()) return Enomem;\n    if (!startEventThread()) return Enomem;')
              replace('    Media *m = nullptr;', '    if (gSink && !gThreadStarted) { IOLockUnlock(lock()); return Ebusy; }\n    Media *m = nullptr;')
              if 'gTable' in source or 'gRing' in source:
                  raise ValueError('unconverted Iris array reference')
              return source
          p = Path('device/drivers/QcomIris/kernel/IrisMedia.cpp')
          original = p.read_text(encoding="utf-8")
          patched = apply(original)
          assert patched != original
          p.write_text(patched, encoding="utf-8")
          print("STORAGE PATCH APPLIED", str(p))
          """Strict fixed-68800685 BootUiTraceProbe permanent-storage transformation.

          Only begin's sole BootProcessWorker caller may allocate. Published readers still
          use trace_lock; acquire/release of the permanent pointer publishes initialization,
          not subsequent mutable data. No free/replacement is permitted during kernel life.
          """
          import argparse
          import hashlib
          from pathlib import Path
          import re
          SOURCE_BLOB = 'c8ec96989880ee6623d1b04c5854863e8896ebe7'
          FIELDS = ('samples', 'draft', 'published', 'hot_prev', 'sample_k')
          ENTRIES = {'void boot_ui_trace_begin(void) {': 'begin', 'void boot_ui_trace_task(task_t task,unsigned index,int pid,const char *name,unsigned slide) {': 'return;', 'void boot_ui_trace_publish(void) {': 'return;', 'unsigned boot_ui_trace_role_rows(unsigned role,char rows[][120],unsigned max,unsigned detail) {': 'return 0;', 'unsigned boot_ui_trace_hot_rows(char rows[][120],unsigned max) {': 'return 0;', 'int boot_ui_trace_role_peer(unsigned role) {': 'return -1;', 'void boot_ui_trace_snapshot(unsigned seconds) {': 'return;'}
          STORAGE = '// UI trace storage is allocated once by BootProcessWorker and never freed.\n// The pointer publishes initialization; trace_lock still protects published data.\nstruct bt_trace_storage {\n struct bt_entry samples[BT_MAX_THREADS];\n struct bt_groups draft,published;\n struct bt_prev hot_prev[BT_ROLES][BT_MAX_THREADS];\n uint64_t sample_k[BT_MAX_THREADS][BT_KFRAMES];\n};\nstatic struct bt_trace_storage *bt_trace_storage_ptr;\nvoid *IOMallocAligned(vm_size_t,vm_offset_t);\n'
          BEGIN = '\n struct bt_trace_storage *storage=__atomic_load_n(&bt_trace_storage_ptr,__ATOMIC_ACQUIRE);\n if(!storage) {\n  // Only the single capture worker calls begin; allocate outside all trace locks.\n  storage=IOMallocAligned(sizeof(*storage),__alignof__(struct bt_trace_storage));\n  if(!storage)return; // Retry next pass; readers safely return while unavailable.\n  memset(storage,0,sizeof(*storage));\n  __atomic_store_n(&bt_trace_storage_ptr,storage,__ATOMIC_RELEASE);\n }\n'

          def once(source, old, new):
              if source.count(old) != 1:
                  raise ValueError('UI storage anchor must occur exactly once: ' + repr(old))
              return source.replace(old, new, 1)

          def apply(source: str) -> str:
              raw = source.encode('utf-8')
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\x00' + raw).hexdigest()
              if blob != SOURCE_BLOB:
                  raise ValueError('UI storage source drift/already patched: expected ' + SOURCE_BLOB + ', got ' + blob)
              source = once(source, 'static struct bt_entry samples[BT_MAX_THREADS];', '')
              source = once(source, 'static struct bt_prev hot_prev[BT_ROLES][BT_MAX_THREADS];', '')
              source = once(source, 'static struct bt_groups draft,published;', '')
              source = once(source, 'static uint64_t sample_k[BT_MAX_THREADS][BT_KFRAMES],sample_event[BT_MAX_THREADS];', 'static uint64_t sample_event[BT_MAX_THREADS];')
              source = once(source, 'void *IOMallocAligned(vm_size_t,vm_offset_t);', '')
              token = re.compile('//[^\\n]*|/\\*.*?\\*/|"(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\'|[A-Za-z_][A-Za-z_0-9]*', re.S)
              source = token.sub(lambda m: 'storage->' + m[0] if m[0] in FIELDS else m[0], source)
              for signature, result in ENTRIES.items():
                  guard = BEGIN if result == 'begin' else '\n struct bt_trace_storage *storage=__atomic_load_n(&bt_trace_storage_ptr,__ATOMIC_ACQUIRE);\n if(!storage)' + result + '\n'
                  source = once(source, signature, signature + guard)
              source = once(source, 'void boot_ui_trace_begin(void) {', STORAGE + '\nvoid boot_ui_trace_begin(void) {')
              if source.count('__atomic_load_n(&bt_trace_storage_ptr,__ATOMIC_ACQUIRE)') != 7:
                  raise ValueError('missing UI storage entry guard')
              if source.count('__atomic_store_n(&bt_trace_storage_ptr,storage,__ATOMIC_RELEASE)') != 1:
                  raise ValueError('invalid UI storage publication')
              return source
          p = Path('device/package/BootUiTraceProbe.c')
          original = p.read_text(encoding="utf-8")
          patched = apply(original)
          assert patched != original
          p.write_text(patched, encoding="utf-8")
          print("STORAGE PATCH APPLIED", str(p))
          PY
      - name: report full native layout before validation
        run: |
          python3 - <<'PY'
          import ast, pathlib
          p = pathlib.Path('UniXNU/kits/XnuPrelink/fileset_layout.py')
          t = p.read_text()
          anchor = '        self.validate()'
          assert t.count(anchor) == 1, 'layout validation anchor must be unique'
          lines = ["        print('LAYOUT SEGMENTS', self.describe(), flush=True)","        print('LAYOUT ROOTS', {n: (hex(s['va']), hex(s['size'])) for n, s in self.roots.items()}, flush=True)","        diagnostic_placed = []","        for segment in self.native.segments:","            if not segment['size']:","                continue","            begin = self.placements[segment['name']]","            end = self.end(segment['name'])","            for b, e in self.occupied:","                if begin < e and b < end:","                    print('LAYOUT OVERLAP retained', segment['name'], hex(begin), hex(end), hex(b), hex(e), 'bytes', hex(min(end, e) - max(begin, b)), flush=True)","            print('LAYOUT USED', segment['name'], hex(self.used(segment['name'])), 'span', hex(self.span(segment['name'])), flush=True)","            for n, b, e in diagnostic_placed:","                if begin < e and b < end:","                    print('LAYOUT OVERLAP native', segment['name'], n, hex(begin), hex(end), hex(b), hex(e), flush=True)","            diagnostic_placed.append((segment['name'], begin, end))","        print('LAYOUT DATA SECTIONS', [s for s in self.native.sections if s.get('segment') == '__DATA'], flush=True)","        self.validate()"]
          replacement = chr(10).join(lines)
          t = t.replace(anchor, replacement, 1)
          assert replacement in t
          ast.parse(t)
          p.write_text(t)
          PY
      - name: device hook weak stubs (macOS-only hooks; real hooks force-pulled)
        # PIT (run 43406736873): the DEVELOPMENT kernel link fails on 16 weak imports.
        # They are NOT all macOS-only. Verified against the sources:
        #   * 7 hooks HAVE real implementations (device SourceStorage.cpp:264,
        #     SourceRootBinding.cpp:68, BootWatchdogPolicy.c:95; framework
        #     drivers/RamBlock/NativeRamBlock.cpp:693/712). They are the UFS/root
        #     start path (bsd_init, kern_exec, IOKitBSDInit call them); stubbing
        #     them would disable SourceStorage and root verification, so instead
        #     force the linker to pull their archive members with -u.
        #   * 9 are genuinely macOS-only or optional: cs_native4k_* (CS digest
        #     timing, BootLog.c declares them as weak_import arrays), the
        #     memwired/pager-close hooks from the macOS 27.3 profile patches, the
        #     legacy request layout table (has the ios17 fallback), and the
        #     macOS-only Ethernet / software AES probes (LegacyDisplayProbe.cpp
        #     itself comments them "macOS builds only"). arm64e cannot leave an
        #     authenticated pointer to an undefined weak symbol, so these get
        #     weak defaults (project convention).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          # macOS-only hooks. The default must reproduce the ABSENT-hook path,
          # a wrong value silently changes behaviour:
          #   * iokit_physical_descriptor_close_notify is an existence probe:
          #     tracked_ = hook && call(...) == KERN_SUCCESS, and KERN_SUCCESS is 0,
          #     so returning 0 would mark every GPU pool view "tracked" while the
          #     stub never reports a close -> the grant is never returned (leak).
          #     Non-zero return retires the grant, like a kernel without the patch.
          #   * native_legacy_request_layout is the rejection report's offset table;
          #     zeroes read every field at offset 0, so it carries the same iPadOS 17
          #     fallback values LegacyDisplayProbe.cpp uses.
          #   * ml_static_mfree_prepare returns bool; false keeps release off.
          src = ['/* weak defaults for macOS-only hooks; values match the absent-hook path */',
                 '#define WEAK __attribute__((weak, visibility("hidden")))',
                 'WEAK unsigned long cs_native4k_digest_bytes[2];',
                 'WEAK unsigned long cs_native4k_digest_cpu[2];',
                 'WEAK unsigned long cs_native4k_digest_wall[2];',
                 'WEAK unsigned long cs_native4k_record_ticks;',
                 'WEAK unsigned long cs_native4k_chunk_ticks;',
                 'WEAK unsigned long cs_native4k_read_ticks;',
                 'WEAK unsigned long cs_native4k_hash_ticks;',
                 'WEAK unsigned long cs_native4k_bytes;',
                 'WEAK unsigned long cs_native4k_ready_blobs;',
                 'WEAK unsigned long cs_native4k_chunks_made;',
                 'WEAK const unsigned native_legacy_request_layout[6] = {17, 81, 792, 804, 816, 2624};',
                 'WEAK long ml_static_mfree_prepare(void) { return 0; }',
                 'WEAK long iokit_physical_descriptor_close_notify(void) { return -1; }',
                 'WEAK void sheng_ethernet_probe(void) {}',
                 'WEAK void sheng_software_aes_probe(void) {}',
                 '/* 24A446 excludes the USB host/device kext closure and omits QcomDwc3. */',
                 'WEAK void qcom_dwc3_vbus(int value) { (void)value; }',
                 'WEAK unsigned qcom_ucsi_start(unsigned char *out) { (void)out; return 0; }',
                 'WEAK unsigned qcom_ucsi_receive(const unsigned char *in, unsigned length, unsigned char *out) { (void)in; (void)length; (void)out; return 0; }',
                 'WEAK unsigned qcom_ucsi_tick(unsigned char *out) { (void)out; return 0; }',
                 'WEAK int qcom_ucsi_polling(void) { return 0; }',
                 'WEAK void sheng_usb_probe(void) {}',
                 'WEAK long native_hooks_stub_marker(void) { return 0; }']
          path = pathlib.Path('ci-device-stubs.c')
          path.write_text(chr(10).join(src) + chr(10))
          sdk = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path'], text=True).strip()
          obj = pathlib.Path(subprocess.check_output(['pwd'], text=True).strip()) / 'ci-device-stubs.o'
          subprocess.run(['xcrun', 'clang', '-arch', 'arm64e', '-mkernel', '-isysroot', sdk,
                          '-c', '-o', str(obj), str(path)], check=True)
          print('compiled weak stubs ->', obj, os.path.getsize(obj), 'bytes')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CI_DEVICE_STUBS=' + str(obj) + chr(10))
          PY
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          t = p.read_text()
          old = 'KERNEL_EXTRA_ARCHIVES="-L$KERNEL_SDKROOT/usr/local/lib/kernel -lfirehose_kernel $CRYPTO_ARCHIVE"'
